<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlashDelivery — Demo de interfaz</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#192b37;background:#f5f8fb}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}.side{background:#102b3c;color:#d6e4eb;padding:26px 17px;display:flex;flex-direction:column;gap:32px}.brand{font-size:23px;font-weight:800;color:#fff;letter-spacing:-1px;padding:0 12px}.brand span{color:#48d4aa}.tag{font-size:10px;color:#9db6c2;letter-spacing:2px;margin:0 12px 12px}.nav button{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:transparent;color:#b8cbd5;border:0;padding:13px 14px;border-radius:11px;margin:4px 0}.nav button.active,.nav button:hover{background:#21485a;color:#fff}.nav .ico{width:22px;text-align:center}.sidefoot{margin-top:auto;border-top:1px solid #315062;padding:19px 12px 0;font-size:12px;color:#9db6c2}.main{min-width:0}.top{height:82px;background:#fff;border-bottom:1px solid #e7edf1;display:flex;align-items:center;justify-content:space-between;padding:0 38px}.crumb{font-size:13px;color:#7d909c}.topright{display:flex;align-items:center;gap:15px}.pill{border:1px solid #d9eee5;background:#f1fbf6;color:#16835d;padding:8px 11px;border-radius:30px;font-size:12px;font-weight:700}.avatar{width:36px;height:36px;border-radius:50%;background:#dff3ed;color:#147d60;display:grid;place-items:center;font-weight:800}.content{padding:34px 38px;max-width:1500px;margin:auto}.heading{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:26px}.heading h1{font-size:30px;letter-spacing:-1px;margin:0 0 6px}.muted{color:#8295a2;font-size:14px;margin:0}.primary{background:#15b887;color:white;border:0;border-radius:11px;padding:12px 17px;font-weight:700;box-shadow:0 5px 14px #15b88730}.primary:hover{background:#0c9b70}.secondary{border:1px solid #d9e4ea;background:#fff;color:#344b59;padding:10px 13px;border-radius:9px;font-weight:650}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:17px;margin-bottom:24px}.stat,.panel{background:#fff;border:1px solid #e4ebef;border-radius:16px;box-shadow:0 5px 25px #163a4a07}.stat{padding:20px}.stat .label{font-size:12px;color:#81939e;font-weight:650}.stat .num{font-size:30px;font-weight:800;margin:12px 0 8px;letter-spacing:-1px}.trend{font-size:12px;color:#189e75}.workspace{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(290px,1fr);gap:22px}.panel{padding:22px;min-width:0}.panel h2{font-size:17px;letter-spacing:-.4px;margin:0}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:10px}.panelhead small{color:#8396a1}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:17px}.filter{background:#f5f8fa;color:#647b89;border:0;border-radius:8px;padding:8px 11px;font-size:12px}.filter.active{background:#dff8ed;color:#14825d;font-weight:700}table{width:100%;border-collapse:collapse;text-align:left;font-size:13px}th{color:#8b9da8;font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:700;padding:13px 8px;border-bottom:1px solid #e9eef1}td{padding:16px 8px;border-bottom:1px solid #eef2f4;color:#405562}td strong{color:#223a49}.status{display:inline-block;padding:6px 9px;border-radius:7px;font-size:11px;font-weight:750}.pending{background:#fff4dd;color:#b87c18}.assigned{background:#e8f1ff;color:#3c6bb5}.picked{background:#f0eaff;color:#8150ba}.delivered{background:#e4f8ec;color:#1c9161}.cancelled{background:#fbe9e9;color:#b75d5d}.empty{padding:30px;text-align:center;color:#81939e}.activity{display:grid;gap:19px}.event{display:grid;grid-template-columns:12px 1fr;gap:12px;position:relative}.dot{height:11px;width:11px;border-radius:50%;background:#18bb8b;margin-top:4px}.event:not(:last-child):before{content:"";position:absolute;top:18px;bottom:-18px;left:5px;width:2px;background:#e2eee9}.event b{font-size:13px}.event p{font-size:12px;color:#8a9ba6;margin:5px 0}.banner{margin-top:22px;border-radius:14px;padding:18px 22px;background:linear-gradient(115deg,#133b4c,#176d67);color:white;display:flex;justify-content:space-between;align-items:center;gap:15px}.banner h3{margin:0 0 5px;font-size:16px}.banner p{margin:0;color:#b5d9d8;font-size:12px}.banner button{border:1px solid #ffffff50;background:#ffffff1c;color:white;padding:10px 12px;border-radius:9px}.couriergrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}.deliverycard{border:1px solid #e3ebee;border-radius:12px;padding:17px}.deliverycard h3{font-size:15px;margin:0 0 9px}.deliverycard p{color:#6e8491;font-size:13px;line-height:1.6}.deliverycard .row{display:flex;justify-content:space-between;align-items:center;gap:10px}.deliverycard .price{font-weight:800;color:#168a69}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:7px;font-size:13px;font-weight:650}.field input,.field select{border:1px solid #dbe5e9;border-radius:9px;padding:12px;color:#233c49;background:#fff}.field.wide{grid-column:1/-1}.modalback{position:fixed;inset:0;background:#102b3c99;display:grid;place-items:center;padding:20px;z-index:20}.modal{background:white;border-radius:18px;padding:28px;width:min(540px,100%);box-shadow:0 24px 100px #0004}.modal h2{margin:0 0 8px}.modal .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.hidden{display:none!important}.toast{position:fixed;bottom:22px;right:22px;background:#163e4b;color:white;padding:13px 18px;border-radius:11px;box-shadow:0 10px 40px #0002;z-index:30;font-size:13px}.topselect{border:1px solid #dae6e9;background:#fff;padding:9px;border-radius:9px;color:#385463}.hint{font-size:12px;color:#8b9da8;margin-top:15px}.cardlist{display:grid;gap:12px}.info{padding:14px;background:#f4faf8;border-radius:10px;color:#38675a;font-size:13px}.mobilemenu{display:none}@media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}.workspace{grid-template-columns:1fr}}@media(max-width:700px){.app{grid-template-columns:1fr}.side{display:none}.top{padding:0 18px;height:66px}.mobilemenu{display:block;border:0;background:transparent;font-size:22px}.content{padding:23px 16px}.heading{align-items:flex-start}.heading h1{font-size:25px}.stats{gap:10px}.stat{padding:15px}.stat .num{font-size:25px}.panel{padding:15px}.tablewrap{overflow:auto}.formgrid{grid-template-columns:1fr}.field.wide{grid-column:auto}.banner{align-items:flex-start;flex-direction:column}.topright .pill{display:none}.side.open{display:flex;position:fixed;inset:0 auto 0 0;width:260px;z-index:25}.topselect{max-width:135px}}
</style></head><body><div class="app"><aside class="side" id="side"><div><div class="brand">⚡ Flash<span>Delivery</span></div><div class="tag">LOGÍSTICA INTELIGENTE</div></div><nav class="nav" id="nav"></nav><div class="sidefoot">● Entorno de demostración<br><br>Interfaz conceptual · v1.0</div></aside><main class="main"><header class="top"><div style="display:flex;align-items:center;gap:12px"><button class="mobilemenu" onclick="document.getElementById('side').classList.toggle('open')">☰</button><div class="crumb">FlashDelivery / <strong id="breadcrumb">Resumen</strong></div></div><div class="topright"><span class="pill">● Sistema operativo</span><select class="topselect" id="role" onchange="setRole(this.value)"><option value="store">Vista comercio</option><option value="courier">Vista repartidor</option><option value="admin">Vista administrador</option></select><div class="avatar" id="avatar">CM</div></div></header><div class="content" id="content"></div></main></div><div id="modal" class="modalback hidden" onclick="if(event.target===this)closeModal()"><div class="modal" id="modalinner"></div></div><div class="toast hidden" id="toast"></div><script>
let role='store',page='dashboard',filter='Todos',available=true;let orders=[{id:'FD-2048',store:'Café del Mar',zone:'Centro',dest:'Calle 18 # 5-24',status:'PENDING',courier:null,fee:8500,time:'Hace 2 min'},{id:'FD-2047',store:'Café del Mar',zone:'Rodadero',dest:'Carrera 4 # 12-31',status:'ASSIGNED',courier:'Andrés Pérez',fee:9500,time:'Hace 12 min'},{id:'FD-2046',store:'Café del Mar',zone:'Centro',dest:'Calle 22 # 8-10',status:'PICKED_UP',courier:'Laura Gómez',fee:7500,time:'Hace 28 min'},{id:'FD-2045',store:'Café del Mar',zone:'Bavaria',dest:'Carrera 12 # 26-09',status:'DELIVERED',courier:'Andrés Pérez',fee:11000,time:'Hace 1 h'}];let events=[['FD-2048','Nueva entrega creada','Hace 2 minutos'],['FD-2047','Andrés aceptó una entrega','Hace 12 minutos'],['FD-2046','Paquete recogido','Hace 28 minutos'],['FD-2045','Entrega completada','Hace 1 hora']];const labels={PENDING:'Pendiente',ASSIGNED:'Asignado',PICKED_UP:'En camino',DELIVERED:'Entregado',CANCELLED:'Cancelado'},classes={PENDING:'pending',ASSIGNED:'assigned',PICKED_UP:'picked',DELIVERED:'delivered',CANCELLED:'cancelled'};function money(n){return '$'+n.toLocaleString('es-CO')}function badge(s){return `<span class="status ${classes[s]}">${labels[s]}</span>`}function setRole(v){role=v;page='dashboard';filter='Todos';document.getElementById('avatar').textContent=v==='store'?'CM':v==='courier'?'RP':'AD';render()}function navigate(p){page=p;filter='Todos';document.getElementById('side').classList.remove('open');render()}function render(){const menu=role==='store'?[['dashboard','◫','Resumen'],['orders','▤','Mis entregas'],['create','＋','Nueva entrega'],['tracking','◎','Seguimiento']]:role==='courier'?[['dashboard','◫','Mi jornada'],['available','⌖','Entregas disponibles'],['active','▤','Mi entrega activa'],['history','◷','Historial']]:[['dashboard','◫','Resumen general'],['orders','▤','Todas las entregas'],['couriers','♧','Repartidores'],['stores','▣','Comercios']];document.getElementById('nav').innerHTML=menu.map(([p,i,t])=>`<button class="${page===p?'active':''}" onclick="navigate('${p}')"><span class="ico">${i}</span>${t}</button>`).join('');const title=menu.find(m=>m[0]===page)?.[2]||'Resumen';document.getElementById('breadcrumb').textContent=title;let out=page==='dashboard'?dashboard():page==='orders'||page==='history'?ordersView():page==='create'?createView():page==='available'?availableView():page==='active'?activeView():page==='tracking'?trackingView():page==='couriers'?couriersView():storesView();document.getElementById('content').innerHTML=out}function heading(t,d,action=''){return `<div class="heading"><div><h1>${t}</h1><p class="muted">${d}</p></div>${action}</div>`}function stat(l,n,foot){return `<div class="stat"><div class="label">${l}</div><div class="num">${n}</div><div class="trend">${foot}</div></div>`}function dashboard(){const pending=orders.filter(o=>o.status==='PENDING').length,delivered=orders.filter(o=>o.status==='DELIVERED').length;return heading(role==='courier'?'¡Buen día, repartidor!':role==='admin'?'Centro de operaciones':'¡Hola, Café del Mar! 👋',role==='courier'?'Estas son tus oportunidades de entrega.':'Aquí tienes el estado de tus entregas en tiempo real.',role==='store'?'<button class="primary" onclick="navigate(\'create\')">＋ Nueva entrega</button>':'')+`<div class="stats">${stat('Entregas totales',orders.length,'Datos de demostración')}${stat('Pendientes',pending,'Esperando repartidor')}${stat('Completadas',delivered,'Entregas finalizadas')}${stat('Volumen generado',money(orders.reduce((a,o)=>a+o.fee,0)),'Tarifas de ejemplo')}</div><div class="workspace"><section class="panel"><div class="panelhead"><h2>${role==='courier'?'Entregas disponibles':'Entregas recientes'}</h2><button class="secondary" onclick="navigate('${role==='courier'?'available':'orders'}')">Ver todas →</button></div>${role==='courier'?deliveryCards(orders.filter(o=>o.status==='PENDING')):orderTable(orders.slice(0,4))}</section><section class="panel"><div class="panelhead"><h2>Actividad reciente</h2><small>Hoy</small></div><div class="activity">${events.map(e=>`<div class="event"><div class="dot"></div><div><b>${e[1]}</b><p>${e[0]} · ${e[2]}</p></div></div>`).join('')}</div></section></div><div class="banner"><div><h3>Entregas más simples, decisiones más rápidas</h3><p>Seguimiento, asignación y operación en un solo lugar.</p></div><button onclick="showToast('Esta es una demostración interactiva sin backend.')">Acerca de la demo →</button></div>`}function orderTable(arr){return `<div class="tablewrap"><table><thead><tr><th>Pedido</th><th>Destino</th><th>Estado</th><th>Tarifa</th><th></th></tr></thead><tbody>${arr.map(o=>`<tr><td><strong>${o.id}</strong><br><small style="color:#8b9da8">${o.time}</small></td><td>${o.dest}</td><td>${badge(o.status)}</td><td>${money(o.fee)}</td><td><button class="secondary" onclick="detail('${o.id}')">Ver</button></td></tr>`).join('')}</tbody></table>${!arr.length?'<div class="empty">No hay entregas para este filtro.</div>':''}</div>`}function ordersView(){let filtered=filter==='Todos'?orders:orders.filter(o=>labels[o.status]===filter);return heading(role==='admin'?'Todas las entregas':'Mis entregas','Consulta el estado y los detalles de cada solicitud.',role==='store'?'<button class="primary" onclick="navigate(\'create\')">＋ Nueva entrega</button>':'')+`<section class="panel"><div class="filters">${['Todos','Pendiente','Asignado','En camino','Entregado','Cancelado'].map(f=>`<button class="filter ${f===filter?'active':''}" onclick="filter='${f}';render()">${f}</button>`).join('')}</div>${orderTable(filtered)}</section>`}function createView(){return heading('Nueva entrega','Registra una solicitud para que los repartidores de la zona puedan aceptarla.')+`<section class="panel" style="max-width:790px"><form id="createForm" onsubmit="createOrder(event)"><div class="formgrid"><label class="field">Nombre del destinatario<input name="recipient" required placeholder="Ej. María Rodríguez"></label><label class="field">Teléfono de contacto<input name="phone" required placeholder="300 000 0000"></label><label class="field wide">Dirección de entrega<input name="address" required placeholder="Calle, carrera y número"></label><label class="field">Zona<select name="zone"><option>Centro</option><option>Rodadero</option><option>Bavaria</option></select></label><label class="field">Tarifa (COP)<input name="fee" type="number" min="1000" value="8500" required></label><label class="field wide">Indicaciones adicionales<input name="notes" placeholder="Apartamento, referencias, instrucciones..."></label></div><div style="margin-top:23px"><button class="primary" type="submit">Publicar solicitud</button></div></form><p class="hint">Los datos se guardan solo durante esta sesión del navegador.</p></section>`}function createOrder(e){e.preventDefault();let d=new FormData(e.target);let id='FD-'+(2049+orders.length-4);orders.unshift({id,store:'Café del Mar',zone:d.get('zone'),dest:d.get('address'),status:'PENDING',courier:null,fee:Number(d.get('fee')),time:'Ahora'});events.unshift([id,'Nueva entrega creada','Ahora']);page='orders';render();showToast('Solicitud '+id+' publicada correctamente')}function deliveryCards(arr){return arr.length?`<div class="couriergrid">${arr.map(o=>`<div class="deliverycard"><div class="row"><h3>${o.id}</h3>${badge(o.status)}</div><p>📍 ${o.zone}<br>🏁 ${o.dest}<br>🏪 ${o.store}</p><div class="row"><span class="price">${money(o.fee)}</span><button class="primary" onclick="accept('${o.id}')" ${!available?'disabled style="opacity:.5"':''}>Aceptar</button></div></div>`).join('')}</div>`:'<div class="empty">No hay solicitudes abiertas por el momento.</div>'}function availableView(){return heading('Entregas disponibles','Acepta una solicitud abierta en tu zona.')+`<div class="info" style="margin-bottom:18px">Disponibilidad: <strong>${available?'Activa':'Inactiva'}</strong> <button class="secondary" style="margin-left:12px" onclick="available=!available;render();showToast('Disponibilidad actualizada')">${available?'Desactivarme':'Activarme'}</button></div>${deliveryCards(orders.filter(o=>o.status==='PENDING'))}`}function activeView(){let a=orders.find(o=>o.courier==='Tú'&&['ASSIGNED','PICKED_UP'].includes(o.status));return heading('Mi entrega activa','Gestiona el avance de la entrega asignada.')+`<section class="panel">${a?`<h2>${a.id} ${badge(a.status)}</h2><p>Destino: ${a.dest}</p><p>Zona: ${a.zone}</p><p>Tarifa: ${money(a.fee)}</p><button class="primary" onclick="advance('${a.id}')">${a.status==='ASSIGNED'?'Marcar como recogida':'Marcar como entregada'}</button>`:'<div class="empty">No tienes entregas activas. <button class="secondary" onclick="navigate(\'available\')">Explorar entregas</button></div>'}</section>`}function accept(id){if(!available)return showToast('Activa tu disponibilidad primero.');if(orders.some(o=>o.courier==='Tú'&&['ASSIGNED','PICKED_UP'].includes(o.status)))return showToast('Ya tienes una entrega activa.');let o=orders.find(x=>x.id===id);if(!o||o.status!=='PENDING')return showToast('La entrega ya no está disponible.');o.status='ASSIGNED';o.courier='Tú';events.unshift([id,'Aceptaste una entrega','Ahora']);page='active';render();showToast('Entrega '+id+' asignada correctamente')}function advance(id){let o=orders.find(x=>x.id===id);o.status=o.status==='ASSIGNED'?'PICKED_UP':'DELIVERED';events.unshift([id,o.status==='DELIVERED'?'Entrega completada':'Paquete recogido','Ahora']);render();showToast('Estado actualizado')}function trackingView(){return heading('Seguimiento de entregas','Consulta la evolución de un pedido.')+`<section class="panel"><label class="field" style="max-width:350px">Pedido<select id="track" onchange="trackRender()">${orders.map(o=>`<option value="${o.id}">${o.id}</option>`).join('')}</select></label><div id="trackResult" style="margin-top:24px"></div></section>`}function trackRender(){let o=orders.find(x=>x.id===document.getElementById('track').value);document.getElementById('trackResult').innerHTML=`<h2>${o.id} · ${badge(o.status)}</h2><p style="color:#81939e">Destino: ${o.dest}</p><div class="activity" style="margin-top:25px">${['PENDING','ASSIGNED','PICKED_UP','DELIVERED'].map((s,i)=>`<div class="event"><div class="dot" style="background:${['PENDING','ASSIGNED','PICKED_UP','DELIVERED'].indexOf(o.status)>=i?'#18bb8b':'#dbe5e9'}"></div><div><b>${labels[s]}</b><p>${['Solicitud registrada','Repartidor asignado','Paquete recogido','Entrega finalizada'][i]}</p></div></div>`).join('')}</div>`}function couriersView(){return heading('Repartidores','Vista conceptual de la gestión de repartidores.')+`<section class="panel">${orderTable(orders.filter(o=>o.courier))}<p class="hint">La gestión real de repartidores se implementará mediante los contratos del módulo Couriers.</p></section>`}function storesView(){return heading('Comercios','Vista conceptual de los comercios registrados.')+`<section class="panel"><h2>Café del Mar</h2><p class="muted">Comercio de demostración · Zona Centro</p><p class="hint">La administración de comercios se conectará al módulo Stores.</p></section>`}function detail(id){let o=orders.find(x=>x.id===id);document.getElementById('modalinner').innerHTML=`<h2>Entrega ${o.id}</h2><p class="muted">Detalles de la solicitud</p><div class="cardlist" style="margin-top:22px"><div><b>Estado</b><p>${badge(o.status)}</p></div><div><b>Dirección</b><p>${o.dest}</p></div><div><b>Zona</b><p>${o.zone}</p></div><div><b>Repartidor</b><p>${o.courier||'Aún sin asignar'}</p></div><div><b>Tarifa</b><p>${money(o.fee)}</p></div></div><div class="actions">${role==='store'&&o.status==='PENDING'?`<button class="secondary" onclick="cancelOrder('${id}')">Cancelar entrega</button>`:''}<button class="primary" onclick="closeModal()">Cerrar</button></div>`;document.getElementById('modal').classList.remove('hidden')}function cancelOrder(id){let o=orders.find(x=>x.id===id);o.status='CANCELLED';events.unshift([id,'Entrega cancelada','Ahora']);closeModal();render();showToast('Entrega cancelada')}function closeModal(){document.getElementById('modal').classList.add('hidden')}function showToast(t){let el=document.getElementById('toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(window.tt);window.tt=setTimeout(()=>el.classList.add('hidden'),3000)}const originalRender=render;render=function(){originalRender();if(page==='tracking')trackRender()};render();
</script></body></html>
